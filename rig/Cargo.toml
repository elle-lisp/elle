[package]
name = "elle-rig"
version = "2.0.0"
edition = "2021"
description = "The executable the implementation suite runs on: elle, configured per file by a sidecar"
license = "MIT"
publish = false

[[bin]]
name = "elle-rig"
path = "src/main.rs"

[dependencies]
elle = { path = "..", default-features = false }
toml = "0.9"

# The rig is built against the features `elle` is built with. Each one names
# the build the rig hosts (rig/overview.md).
[features]
default = ["jit", "ffi", "uring"]
jit = ["elle/jit"]
ffi = ["elle/ffi"]
uring = ["elle/uring"]
mlir = ["elle/mlir"]
wasm = ["elle/wasm"]
