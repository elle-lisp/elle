name: PR

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for source changes
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.(rs|lisp)$|^Cargo\.|^Makefile$|^\.cargo/'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi

  qa:
    name: QA (fmt, clippy, doc)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      MLIR_SYS_220_PREFIX: /usr/lib/llvm-22
      TABLEGEN_220_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 22 (for mlir feature)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libpolly-22-dev mlir-22-tools libmlir-22-dev libclang-22-dev clang-22
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy on workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  tests:
    name: VM+JIT Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GNU parallel and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel redis-server libsqlite3-dev libz-dev libzstd-dev libgit2-dev
          sudo systemctl start redis-server
      - name: make elle
        run: make elle
      - name: make doctest
        run: make doctest
      - name: make smoke-vm
        run: make smoke-vm
      - name: make smoke-jit
        run: make smoke-jit
      - name: make smoke-diff
        run: make smoke-diff

  tests-combined:
    name: Rust Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 16
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"

  mlir:
    name: MLIR Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      MLIR_SYS_220_PREFIX: /usr/lib/llvm-22
      TABLEGEN_220_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mlir
      - name: Install LLVM 22 and GNU parallel
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libpolly-22-dev mlir-22-tools libmlir-22-dev libclang-22-dev clang-22 parallel
      - name: make elle-mlir
        run: make elle-mlir
      - name: make doctest
        run: make doctest
      - name: make smoke-mlir
        run: make smoke-mlir
      - name: make smoke-diff
        run: make smoke-diff

  wasm:
    name: WASM Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: Install GNU parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: make elle-wasm
        run: make elle-wasm
      - name: make doctest
        run: make doctest
      - name: make smoke-wasm
        run: make smoke-wasm
      - name: make smoke-diff
        run: make smoke-diff

  aarch64:
    name: AArch64 Smoke
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 8
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - name: Install GNU parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: make elle
        run: make elle
      - name: make doctest
        run: make doctest
      - name: make smoke
        run: make smoke
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"

  aarch64-noffi:
    name: AArch64 No-Features
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 8
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-noffi
      - name: Install GNU parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: make elle-noffi
        run: make elle-noffi
      - name: make smoke-noffi
        run: make smoke-noffi

  android:
    name: Android Cross-Check
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Configure NDK toolchain
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* | sort -V | tail -1)
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=llvm-ar" >> "$GITHUB_ENV"
      - name: Cross-check Android
        run: cargo check --target aarch64-linux-android --no-default-features -p elle

  macos:
    name: macOS Smoke
    needs: changes
    runs-on: macos-latest
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 8
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - name: Install GNU parallel and coreutils
        run: brew install parallel coreutils
      - name: make elle
        run: make elle
      - name: Diagnose process-io.lisp hang (timing loop)
        # TEMPORARY (remove with the io_trace instrumentation once test 18 is
        # fixed): the macOS smoke wedges in tests/elle/process-io.lisp (test
        # 18) on the threadpool backend. It is a TIGHT TIMING RACE — a single
        # ELLE_TRACE=io run passed, because the per-op write(2) widens the
        # loser's window enough to close the race. So probe the timing
        # dependence directly: run untraced N times to measure the hang rate,
        # then traced N times to try to catch a hung run with its [trace:io]
        # tail. The last `tp-submit`/`close … shutdown` with no matching
        # `tp-complete` in a hung trace names the stuck op and fd.
        continue-on-error: true
        run: |
          set +e
          BIN=./target/release/elle
          FLAGS="--checked-intrinsics --jit=off --mlir=off"
          T=tests/elle/process-io.lisp
          echo "==== untraced: hang rate ===="
          uh=0
          for i in $(seq 1 8); do
            timeout 30s $BIN $FLAGS $T >/dev/null 2>&1
            [ $? -eq 124 ] && uh=$((uh+1)) && echo "  untraced run $i: HANG"
          done
          echo "untraced hangs: $uh/8"
          echo "==== traced: try to catch a hung run ===="
          th=0
          for i in $(seq 1 8); do
            ELLE_TRACE=io timeout 30s $BIN $FLAGS $T >run.out 2>&1
            if [ $? -eq 124 ]; then
              th=$((th+1)); echo "  traced run $i: HANG (captured)"
              cp run.out hung-trace.txt
            fi
          done
          echo "traced hangs: $th/8"
          if [ -f hung-trace.txt ]; then
            echo "==== last 60 lines of a HUNG traced run ===="
            tail -60 hung-trace.txt
          else
            echo "(no traced run hung: tracing masks the race — next step is a"
            echo " near-zero-overhead in-memory ring dumped on SIGTERM)"
          fi
      - name: make doctest
        run: make doctest
      - name: make smoke
        run: make smoke
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"

  all-checks:
    name: All Checks Passed
    needs: [changes, qa, tests-combined, tests, wasm, mlir, aarch64, aarch64-noffi, android, macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check QA
        if: needs.qa.result == 'failure'
        run: exit 1
      - name: Check combined tests
        if: needs.tests-combined.result == 'failure'
        run: exit 1
      - name: Check tests
        if: needs.tests.result == 'failure'
        run: exit 1
      - name: Check MLIR
        if: needs.mlir.result == 'failure'
        run: exit 1
      - name: Check WASM
        if: needs.wasm.result == 'failure'
        run: exit 1
      - name: Check aarch64
        if: needs.aarch64.result == 'failure'
        run: exit 1
      - name: Check aarch64-noffi
        if: needs.aarch64-noffi.result == 'failure'
        run: exit 1
      - name: Check Android
        if: needs.android.result == 'failure'
        run: exit 1
      - name: Check macOS
        if: needs.macos.result == 'failure'
        run: exit 1
      - name: Check changes detection
        if: needs.changes.result == 'failure'
        run: exit 1
      - name: Success
        run: echo "All checks passed"
