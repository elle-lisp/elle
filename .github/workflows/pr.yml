name: PR

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for source changes
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.(rs|lisp)$|^Cargo\.|^Makefile$|^\.cargo/'; then
            SOURCE=true
          else
            SOURCE=false
          fi
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          # The submodule's recorded pointer is the bare path `plugins` with no
          # extension, so the pattern above never matches a pointer bump — and a
          # pointer bump changes exactly what the plugins job compiles. It gets
          # its own output rather than widening `source`, which would run the
          # whole matrix, macOS included, for a one-line gitlink move.
          if [ "$SOURCE" = true ] || echo "$CHANGED" | grep -qx 'plugins'; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi

  qa:
    name: QA (fmt, clippy, doc)
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      MLIR_SYS_220_PREFIX: /usr/lib/llvm-22
      TABLEGEN_220_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 22 (for mlir feature)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libpolly-22-dev mlir-22-tools libmlir-22-dev libclang-22-dev clang-22
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy on workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The clippy step above only ever sees the Linux arm of every
      # `cfg(target_os)`, so a binding used solely by the io_uring backend reads
      # as dead code on macOS and reaches the Mac runner as a warning. Clippy
      # checks (no codegen, no link), so the macOS arms compile here without an
      # SDK. `--no-default-features` is forced: `ffi` and the `zstd` dependency
      # build C for the host toolchain and cannot cross. That also drops the
      # variant that keeps `HeapObject` balanced, so allow that one lint —
      # the default-features builds still enforce it.
      - name: Cross-check macOS
        run: >
          cargo clippy --target x86_64-apple-darwin --no-default-features -p elle
          -- -D warnings -A clippy::large_enum_variant
      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # The documentation site is generated from docs/*.md plus the Elle sources
  # under src/, so it breaks on a renamed heading or a moved source file as
  # readily as on a code change. Its only other run is the push-to-main job
  # that publishes the site, which discovers such a break after the merge
  # rather than before it. This job is that run, minus the publish.
  #
  # It carries no `if: needs.changes.outputs.source` gate on purpose: the
  # filter reads `source` off .rs/.lisp/Cargo/Makefile paths, so a PR that
  # touches only Markdown — exactly the PR most able to break the generator —
  # would skip the one job that checks it.
  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Build Elle
        run: cargo build --release
      - name: Generate pipeline diagram
        run: make docs
      - name: Generate Elle documentation site
        run: ./target/release/elle demos/docgen/generate.lisp

  tests:
    name: VM+JIT Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GNU parallel and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel redis-server libsqlite3-dev libz-dev libzstd-dev libgit2-dev
          sudo systemctl start redis-server
      - name: make elle
        run: make elle
      - name: make doctest
        run: make doctest
      - name: make smoke-vm
        run: make smoke-vm
      - name: make smoke-jit
        run: make smoke-jit

  # The corpus against the thread-pool I/O backend. Every other Linux job runs
  # io_uring, and every non-Linux build runs the pool, so without this job the
  # pool's only sampler is the macOS one below: one run per PR, on the slowest
  # runner, against defects that hang rather than fail. Redis is installed for
  # the same reason it is in `tests` — `redis-short-read.lisp` gates itself on a
  # live server, and it is a pool-only hang, so a job without Redis would skip
  # the very file that proves the point.
  nouring:
    name: Thread-Pool I/O Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GNU parallel and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel redis-server libsqlite3-dev libz-dev libzstd-dev libgit2-dev
          sudo systemctl start redis-server
      - name: make elle
        run: make elle
      - name: make smoke-nouring
        run: make smoke-nouring

  tests-combined:
    name: Rust Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 16
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"

  mlir:
    name: MLIR Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    env:
      MLIR_SYS_220_PREFIX: /usr/lib/llvm-22
      TABLEGEN_220_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mlir
      - name: Install LLVM 22 and GNU parallel
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libpolly-22-dev mlir-22-tools libmlir-22-dev libclang-22-dev clang-22 parallel
      - name: make elle-mlir
        run: make elle-mlir
      - name: make doctest
        run: make doctest
      - name: make smoke-mlir
        run: make smoke-mlir

  wasm:
    name: WASM Build
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      # The wasm tier carries no production workloads (docs/impl/wasm.md,
      # memory.md § "The backend-realization frontier"), so its corpus does not
      # gate PRs. What must stay green anyway: the feature compiles, and the
      # full-module tier boots. Restore `make smoke-wasm` here (plus the GNU
      # parallel install it needs) when the tier is brought back up.
      - name: make check-wasm
        run: make check-wasm

  # The `plugins/` submodule is a separate cargo workspace whose crates take
  # `elle-plugin` by path, so an `elle_api!` change moves the SDK and the plugin
  # together and the workspace either compiles or does not. Nothing in CI
  # checked it out until this job: #997 changed six declarations, stopped 17
  # plugins from compiling at about 90 call sites, and every gate stayed green
  # (#1023). The ABI version guard cannot stand in — it compares `ABI_VERSION`
  # at load time, and a source break never reaches a load.
  #
  # Checking out at the recorded pointer is also what keeps the pointer fresh: a
  # pointer left behind an ABI change names plugins that no longer compile.
  #
  # `make plugins` builds; `make smoke-plugins` asserts every artifact and then
  # runs the corpus. Without the assertion the corpus reports success over a
  # plugin that never built — see docs/analysis/ci.md § "Why the job asserts its
  # build output".
  plugins:
    name: Plugin Tests
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.plugins == 'true'
    steps:
      - uses: actions/checkout@v4
      # Named, not `submodules: true`: that would also fetch `mcp`, which this
      # job never builds — and an unreachable `mcp` pointer would then fail the
      # one job that reports on the plugins.
      - name: Check out the plugins submodule
        run: git submodule update --init plugins
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plugins
      # clang and libclang for bindgen: elle-oxigraph pulls oxrocksdb-sys, which
      # generates its bindings and compiles vendored RocksDB. Everything else in
      # the portable set is pure Rust (elle-tls takes rustls over ring, not
      # OpenSSL), so no other system library is needed.
      - name: Install GNU parallel and bindgen's toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel clang libclang-dev
      - name: make elle
        run: make elle
      - name: make plugins
        run: make plugins
      - name: make smoke-plugins
        run: make smoke-plugins

  # The corpus half of the AArch64 tier. Its Rust half is `aarch64-tests`
  # below, running at the same time on its own runner — the two share no build
  # and no run, so serializing them made this platform cost the sum. See
  # docs/analysis/ci.md § "Why each platform has two test jobs".
  aarch64:
    name: AArch64 Smoke
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64
      - name: Install GNU parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: make elle
        run: make elle
      - name: make doctest
        run: make doctest
      - name: make smoke
        run: make smoke

  # The Rust half of the AArch64 tier, mirroring the x86_64 `tests-combined`
  # job: `cargo test` builds and runs everything it needs, so this job installs
  # no packages and never invokes the Makefile. Its cache key is its own — it
  # fills the target directory with dev-profile artifacts, where `aarch64`
  # fills one with release artifacts.
  aarch64-tests:
    name: AArch64 Rust Tests
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 8
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-tests
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"

  aarch64-noffi:
    name: AArch64 No-Features
    needs: changes
    runs-on: ubuntu-24.04-arm
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-noffi
      - name: Install GNU parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
      - name: make elle-noffi
        run: make elle-noffi
      - name: make smoke-noffi
        run: make smoke-noffi

  android:
    name: Android Cross-Check
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.source == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Configure NDK toolchain
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT/ndk/"* | sort -V | tail -1)
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=llvm-ar" >> "$GITHUB_ENV"
      - name: Cross-check Android
        run: cargo check --target aarch64-linux-android --no-default-features -p elle

  # The corpus half of the macOS tier. Its Rust half is `macos-tests` below,
  # running at the same time on its own runner. This is the slowest platform in
  # the workflow, so it is the one the split buys the most from — see
  # docs/analysis/ci.md § "Why each platform has two test jobs".
  macos:
    name: macOS Smoke
    needs: changes
    runs-on: macos-latest
    if: needs.changes.outputs.source == 'true'
    env:
      # The release profile strips the symbol table (Cargo.toml: strip =
      # "symbols"), which turns the timeout photograph (src/test.lisp
      # photograph-threads → /usr/bin/sample) into unreadable `???` frames.
      # Keep the symbol table on this runner: it is the box where the corpus
      # wedges, and the photograph is the only evidence a timeout leaves.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      # The other half of `--trace=scrub` below. The scrub's `memset` runs in
      # any build, but the panic that READS the zeros — the `arena::deref`
      # tag/object mismatch that names the deref site and attributes the free —
      # is `#[cfg(debug_assertions)]`. Without this, the release binary scrubs
      # and says nothing: a stale read faults near its site instead of naming
      # it. See docs/impl/region/diagnostics.md § `--trace=scrub`.
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - name: Install GNU parallel, coreutils, and zstd
        # zstd (libzstd) is not a macOS system library; the `elle test` runner
        # loads it for CAS compression and lib/compress.lisp's tests need it.
        # Homebrew installs it under /opt/homebrew/lib, which library_candidates
        # probes explicitly (dyld does not search there for a bare soname).
        run: brew install parallel coreutils zstd
      # The QA job's cross-check covers the macOS arms that build without an
      # SDK; this one is the same gate over `ffi` and `jit`, which only a real
      # Mac can compile. Run it before `make elle` so a warning fails fast.
      - name: Run clippy
        run: cargo clippy -p elle -- -D warnings
      - name: make elle
        run: make elle
      - name: make doctest
        run: make doctest
      # --trace=scrub: this runner is where the corpus corrupts (stale reads
      # surfacing as wrong-typed values, wedges, and segfaults, on the pool
      # backend only this box exercises). Scrub zeroes each released page, so
      # the first stale read panics at the deref naming its site instead of
      # failing minutes later somewhere unrelated. One memset per freed page.
      # The panic itself needs CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS, set above.
      - name: make smoke
        run: make smoke ELLE_TEST_FLAGS=--trace=scrub
      # A batch killed by a signal leaves the batch number and nothing else. The
      # kernel's crash report has the faulting thread's stack, and the symbol
      # table is kept on this runner (CARGO_PROFILE_RELEASE_STRIP above), so the
      # frames are readable. Reports are written asynchronously by ReportCrash,
      # so give it a moment before looking.
      - name: Crash reports
        if: failure()
        run: |
          sleep 15
          dir=~/Library/Logs/DiagnosticReports
          shopt -s nullglob
          reports=("$dir"/elle*.ips "$dir"/elle*.crash)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no crash report for elle under $dir"
            ls -la "$dir" 2>/dev/null || echo "$dir does not exist"
            exit 0
          fi
          for r in "${reports[@]}"; do
            echo "===== $r ====="
            cat "$r"
          done

  # The Rust half of the macOS tier. It skips the clippy gate and the Makefile
  # targets that `macos` above owns, and keeps its own cache key: `cargo test`
  # fills the target directory with dev-profile artifacts, where `macos` fills
  # one with release artifacts.
  macos-tests:
    name: macOS Rust Tests
    needs: changes
    runs-on: macos-latest
    if: needs.changes.outputs.source == 'true'
    env:
      PROPTEST_CASES: 8
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-tests
      # Only zstd, not the GNU parallel and coreutils the `macos` job needs:
      # those two are Makefile tools, and this job runs no Makefile target. The
      # tests spawn the elle binary, which loads libzstd for CAS compression —
      # and libzstd is not a macOS system library. Homebrew installs it under
      # /opt/homebrew/lib, which library_candidates probes explicitly (dyld
      # does not search there for a bare soname).
      - name: Install zstd
        run: brew install zstd
      - name: Run integration tests
        run: cargo test --test '*' -- --skip property
      - name: Run property tests
        run: "cargo test --test lib property::"
      # Same argument as the `macos` job's copy: a test whose elle subprocess
      # dies on a signal reports an exit status and nothing else, and the
      # kernel's report is the only stack. The dev profile keeps its symbols,
      # so this job needs no CARGO_PROFILE_RELEASE_STRIP to read the frames.
      - name: Crash reports
        if: failure()
        run: |
          sleep 15
          dir=~/Library/Logs/DiagnosticReports
          shopt -s nullglob
          reports=("$dir"/elle*.ips "$dir"/elle*.crash)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no crash report for elle under $dir"
            ls -la "$dir" 2>/dev/null || echo "$dir does not exist"
            exit 0
          fi
          for r in "${reports[@]}"; do
            echo "===== $r ====="
            cat "$r"
          done

  all-checks:
    name: All Checks Passed
    needs: [changes, qa, docs, tests-combined, tests, nouring, wasm, mlir, plugins, aarch64, aarch64-tests, aarch64-noffi, android, macos, macos-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check QA
        if: needs.qa.result == 'failure'
        run: exit 1
      - name: Check combined tests
        if: needs.tests-combined.result == 'failure'
        run: exit 1
      - name: Check tests
        if: needs.tests.result == 'failure'
        run: exit 1
      - name: Check thread-pool I/O tests
        if: needs.nouring.result == 'failure'
        run: exit 1
      - name: Check MLIR
        if: needs.mlir.result == 'failure'
        run: exit 1
      # The wasm job is a build-and-boot gate (`make check-wasm`), not the
      # corpus: the tier carries no production workloads, so corpus coverage
      # on it does not gate PRs. A failure here means the wasm feature no
      # longer compiles or the tier no longer boots — that blocks.
      - name: Check WASM
        if: needs.wasm.result == 'failure'
        run: exit 1
      # The only job that compiles the `plugins/` submodule. A failure here is
      # either a plugin the current `elle_api!` no longer accepts, or a recorded
      # submodule pointer left behind an ABI change — both block.
      - name: Check plugins
        if: needs.plugins.result == 'failure'
        run: exit 1
      - name: Check documentation build
        if: needs.docs.result == 'failure'
        run: exit 1
      - name: Check aarch64
        if: needs.aarch64.result == 'failure'
        run: exit 1
      - name: Check aarch64 Rust tests
        if: needs.aarch64-tests.result == 'failure'
        run: exit 1
      - name: Check aarch64-noffi
        if: needs.aarch64-noffi.result == 'failure'
        run: exit 1
      - name: Check Android
        if: needs.android.result == 'failure'
        run: exit 1
      - name: Check macOS
        if: needs.macos.result == 'failure'
        run: exit 1
      - name: Check macOS Rust tests
        if: needs.macos-tests.result == 'failure'
        run: exit 1
      - name: Check changes detection
        if: needs.changes.result == 'failure'
        run: exit 1
      - name: Success
        run: echo "All checks passed"
