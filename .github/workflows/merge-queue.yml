name: Merge Queue Checks

on:
  merge_group:

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every job runs Cranelift's verifier, a `cargo test` step included
  # (docs/impl/verifier.md).
  ELLE_JIT_VERIFY: "on"

jobs:
  tests:
    name: Elle Tests
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 1
      # The suites record every verdict in a session DB, with each result's
      # output in the CAS beside it. Naming the state directory here is what
      # lets the upload below name it too — the default sits under HOME, which
      # moves with the runner image. See docs/analysis/ci.md.
      ELLE_STATE: ${{ github.workspace }}/target/elle-state
      # `make qa`'s clippy and rustdoc build every feature, the MLIR tier among
      # them. The PR's `qa` job sets the same three.
      MLIR_SYS_220_PREFIX: /usr/lib/llvm-22
      TABLEGEN_220_PREFIX: /usr/lib/llvm-22
      LIBCLANG_PATH: /usr/lib/llvm-22/lib
    steps:
      - uses: actions/checkout@v4
      # `make qa` runs rustfmt and clippy, and `make crosscheck` inside it
      # prints SKIPPED and passes over a target the toolchain lacks.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: x86_64-apple-darwin,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 22 (for mlir feature)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libpolly-22-dev mlir-22-tools libmlir-22-dev libclang-22-dev clang-22
      - name: Install GNU parallel and Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel redis-server
          sudo systemctl start redis-server
      - name: Build the release binary and its rig
        run: cargo build --release -p elle -p elle-rig
      # `make smoke`, one step per pass, so a red step names the pass that
      # failed and each step's time is one pass's (docs/analysis/ci.md). The
      # passes are `SMOKE_PASSES`, in order, after `make qa`.
      - name: QA
        run: make qa
      - name: Producers (rig)
        run: make smoke-producers
      # The plugins the language suite loads (docs/analysis/plugins.md § "The
      # plugins the language suite loads"). QA runs first, on a tree without
      # the submodule, as the QA job's does.
      - name: Check out the plugins submodule
        run: git submodule update --init plugins
      - name: make suite-plugins
        run: make suite-plugins
      - name: Language suite
        run: make smoke-lang
      - name: Implementation suite (rig)
        run: make smoke-impl
      - name: Both suites, eager JIT (rig)
        run: make smoke-eager
      - name: Charge per file (rig)
        run: make smoke-charge
      - name: Doctests
        run: make doctest
      - name: Embedding
        run: make embedding
      - name: Library surfaces
        run: make semver-check
      # Pass or fail: a red queue run is the one whose store a reader wants,
      # and the machine goes away with it. `elle test --import` merges the
      # artifact into local history (docs/test-store.md).
      - name: Upload the session store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-merge-queue-tests
          path: |
            target/elle-state/elle-tests.db
            target/elle-state/cas
          retention-days: 14

  all-checks:
    name: All Checks Passed
    needs: [tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check tests
        if: needs.tests.result == 'failure'
        run: exit 1
      - name: Success
        run: echo "All checks passed"
