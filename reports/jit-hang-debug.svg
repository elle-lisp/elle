<text text-anchor="middle" x="303" y="-217" font-family="monospace" font-size="10.00">Refcount tracks BINDING refs only.</text>
<text text-anchor="middle" x="303" y="-204.25" font-family="monospace" font-size="10.00">Struct/array children have rc=0</text>
<text text-anchor="middle" x="303" y="-191.5" font-family="monospace" font-size="10.00">unless also held by a binding.</text>
<text text-anchor="middle" x="303" y="-178.75" font-family="monospace" font-size="10.00">DecrefLocal drops parent rc → 0</text>
<text text-anchor="middle" x="303" y="-166" font-family="monospace" font-size="10.00">release_refcounted propagates</text>
<text text-anchor="middle" x="303" y="-153.25" font-family="monospace" font-size="10.00">from rc&gt;0 objects only.</text>
<text text-anchor="middle" x="303" y="-140.5" font-family="monospace" font-size="10.00">Parent rc=0 → children unprotected</text>
<text text-anchor="middle" x="303" y="-127.75" font-family="monospace" font-size="10.00">→ freed → UAF</text>
</g>
